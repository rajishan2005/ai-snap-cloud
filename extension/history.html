<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orami History</title>
<style>
:root{color-scheme:dark;--bg:#090d1c;--panel:#151c32;--line:#29314b;--text:#f5f7ff;--muted:#a8b0c8;--accent:#8c75ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 5% 0%,#24234f 0,transparent 34%),var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1000px;margin:auto;padding:28px 18px 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{margin:0;font-size:30px;letter-spacing:-.04em}.sub{color:var(--muted);margin:6px 0 20px}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid var(--line);background:#222b46;color:var(--text);padding:10px 13px;border-radius:11px;font-weight:700;cursor:pointer}button.primary{background:var(--accent);border-color:transparent;color:#fff}button.danger{background:#3b1d2b;color:#ffc8d2}.note{background:#131a2c;border:1px solid var(--line);border-radius:14px;padding:13px 15px;color:var(--muted);margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:13px}.item{border:1px solid var(--line);border-radius:16px;background:rgba(21,28,50,.94);overflow:hidden;min-width:0}.preview{height:145px;background:#0b1020;display:grid;place-items:center;color:#9ba5c0;overflow:hidden}.preview img{width:100%;height:100%;object-fit:contain}.preview iframe{width:100%;height:100%;border:0}.fileIcon{font-size:34px}.info{padding:13px}.name{font-weight:750;overflow-wrap:anywhere}.meta{color:var(--muted);font-size:12px;margin:5px 0 12px}.itemActions{display:flex;gap:7px;flex-wrap:wrap}.itemActions button{font-size:12px;padding:8px 10px}.empty{padding:50px 18px;text-align:center;color:var(--muted);border:1px dashed #39415d;border-radius:18px}.status{color:var(--muted);font-size:12px;min-height:20px;margin-top:12px}
</style></head>
<body><main class="wrap"><div class="top"><div><h1>Orami History</h1><div class="sub">Files received by this browser profile</div></div><div class="actions"><button id="refresh">Refresh</button><button id="clear" class="danger">Clear history</button></div></div><div class="note">Files are stored locally in this browser profile for up to 7 days (maximum 100 files / 150 MB). Downloaded files go to your normal Downloads folder. Sending files to an AI website is a separate action.</div><div id="status" class="status"></div><div id="list" class="grid"></div></main><script src="history.js"></script></body></html>
