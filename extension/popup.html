<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Snap</title>
<style>
body{font:14px system-ui,sans-serif;width:320px;padding:16px;margin:0;color:#151827}
h3{margin:0 0 4px;font-size:18px}.sub{color:#697087;font-size:12px;margin-bottom:14px}
label{display:block;font-weight:650;margin:10px 0 5px}
input,button{width:100%;box-sizing:border-box;padding:10px 11px;margin:4px 0;border-radius:10px}
input{border:1px solid #cbd0dc;outline:none}.code{font:800 24px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:4px;text-align:center}
button{border:0;cursor:pointer;font-weight:700}.primary{background:#111827;color:white}.secondary{background:#eef0f5;color:#111827}.danger{background:#fff0f0;color:#a21d1d}
#status{margin-top:10px;min-height:20px;line-height:1.4}.ok{color:#087443}.bad{color:#b42318}
.pair{display:none;margin-top:12px;padding-top:12px;border-top:1px solid #e7e9ef}.pair.show{display:block}
.link{font-size:11px;word-break:break-all;color:#596177;background:#f6f7fa;padding:8px;border-radius:8px;margin-top:6px}
.small{font-size:11px;color:#697087;line-height:1.4;margin-top:8px}
</style>
</head>
<body>
<h3>📸 AI Snap</h3>
<div class="sub">🔐 E2EE • sends to your currently visible ChatGPT chat</div>
<label for="baseUrl">Cloud server URL</label>
<input id="baseUrl" type="url" placeholder="https://your-server.example" autocomplete="off">
<button id="save" class="secondary">Save server URL</button>
<button id="pair" class="primary">Create Secure Pairing</button>
<div id="pairBox" class="pair">
<label>Pairing code</label><input id="code" class="code" readonly>
<div class="link" id="mobileUrl"></div>
<button id="copy" class="secondary">Copy phone link</button>
<button id="newPair" class="secondary">Create New Pairing</button>
<button id="clearPair" class="danger">Clear This Pairing</button>
<div class="small">A new pairing generates a new encryption key. The old code stops working.</div>
</div>
<div id="status"></div>
<script src="popup.js"></script>
</body>
</html>
