<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1024">
<title>Orami</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<style>
:root{--bg:#080b18;--text:#f7f7ff;--muted:#b8bbce;--glass:rgba(30,36,66,.82);--line:rgba(255,255,255,.15);--green:#53e88a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}body{min-height:100svh;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;pointer-events:none;filter:blur(55px);opacity:.65;z-index:0;border-radius:50%}body:before{width:260px;height:260px;left:-100px;top:12%;background:#4b3c9f}body:after{width:300px;height:300px;right:-130px;bottom:8%;background:#164eaa}
.app{position:relative;z-index:1;min-height:100svh;max-width:520px;margin:auto;padding:18px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column}.topbar{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 18px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}.logo{width:40px;height:40px;border:1px solid rgba(155,180,255,.7);border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(100,142,255,.3),rgba(147,92,255,.22));box-shadow:0 0 22px rgba(111,120,255,.18)}.logo svg{width:27px;height:27px;display:block}.connection{display:flex;align-items:center;gap:7px;padding:9px 12px;border-radius:999px;background:rgba(28,36,67,.68);border:1px solid rgba(255,255,255,.08);font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.hero{text-align:center;margin:7vh 0 34px}.hero h1{font-size:31px;line-height:1.05;margin:0 0 12px;letter-spacing:-.04em}.hero p{margin:0 auto;max-width:330px;color:var(--muted);font-size:15px;line-height:1.55}.glass{background:var(--glass);border:1px solid var(--line);border-radius:25px;box-shadow:0 22px 70px rgba(0,0,0,.3),inset 0 1px rgba(255,255,255,.07);backdrop-filter:blur(22px)}
.actions{display:flex;flex-direction:column;gap:14px}.action{appearance:none;width:100%;min-height:104px;padding:18px;border:1px solid rgba(255,255,255,.16);border-radius:23px;color:#fff;text-align:left;background:linear-gradient(145deg,rgba(92,99,145,.7),rgba(36,42,76,.83));display:flex;align-items:center;gap:16px;box-shadow:inset 0 1px rgba(255,255,255,.12),0 14px 35px rgba(0,0,0,.18);cursor:pointer}.action:active{transform:scale(.985)}.action-icon{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;background:rgba(255,255,255,.12);flex:none}.action-icon svg{width:34px;height:34px;display:block;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.section-label{margin:5px 4px 0;color:#aeb5d2;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.action strong{display:block;font-size:17px;margin-bottom:5px}.action span{display:block;color:#c7c9d9;font-size:13px}.bottom{margin-top:auto;padding-top:26px}.status{display:flex;align-items:center;justify-content:center;gap:8px;color:#aeb2c6;font-size:12px;padding:12px 15px;border-radius:18px;background:rgba(20,27,52,.65);border:1px solid rgba(255,255,255,.08)}.pair{padding:24px}.pair h2{text-align:center;margin:2px 0 8px;font-size:24px}.pair p{text-align:center;color:var(--muted);font-size:14px;line-height:1.5;margin:0 auto 20px;max-width:310px}.pairInput{width:100%;height:58px;padding:0 14px;border-radius:16px;border:1px solid rgba(255,255,255,.18);background:rgba(8,12,28,.5);color:#fff;text-align:center;letter-spacing:7px;text-transform:uppercase;font:800 25px ui-monospace,monospace;outline:none}.primary,.secondary{display:block;width:100%;height:54px;margin-top:12px;border-radius:18px;font-size:16px;font-weight:750}.primary{border:0;color:white;background:linear-gradient(100deg,#8b5cf6,#4f8cff)}.secondary{border:1px solid rgba(255,255,255,.13);color:#fff;background:rgba(255,255,255,.08);font-size:14px}.error{text-align:center;color:#ffaaa9;font-size:12px;min-height:18px;margin-top:10px}.preview{margin-top:18px;padding:10px;border-radius:23px;background:rgba(12,17,37,.7);border:1px solid rgba(255,255,255,.1)}.preview img{display:block;width:100%;max-height:45vh;object-fit:cover;border-radius:17px}.success{text-align:center}.success h2{font-size:27px;margin:6px 0 8px}.help-link{display:block;text-align:center;margin:14px 0 2px;color:#bba5ff;font-size:13px;font-weight:800;text-decoration:underline;text-underline-offset:3px}.help-link:hover{color:#fff}input[type=file]{display:none}.hidden{display:none!important}.tiny{text-align:center;color:#858aa2;font-size:11px;margin-top:9px}
@media(max-height:700px){.hero{margin:22px 0 20px}.hero h1{font-size:27px}.action{min-height:88px}.action-icon{width:54px;height:54px}.action-icon svg{width:30px;height:30px}}
</style>
</head>
<body><div class="app"><div class="topbar"><div class="brand"><div class="logo" aria-label="Orami logo"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M5 13.5 5.8 5l8 5.1a9.7 9.7 0 0 1 4.4 0L26.2 5l.8 8.5c.8 1.5 1.2 3 1.2 4.7A12.2 12.2 0 0 1 16 30 12.2 12.2 0 0 1 3.8 18.2c0-1.7.4-3.2 1.2-4.7Z" fill="white"/><path d="M11.4 17.2h.1m9 0h.1" stroke="#292c53" stroke-width="3" stroke-linecap="round"/><path d="m14 21 2 1.7 2-1.7" stroke="#292c53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>Orami</div><div class="connection"><i class="dot"></i><span id="conn">Checking…</span></div></div><div id="screen"></div></div>
<input id="cameraInput" type="file" accept="image/*" capture="environment"><input id="galleryInput" type="file" accept="image/*" multiple><input id="fileInput" type="file" accept=".pdf,.csv,.txt,.docx,.xlsx,.pptx,application/pdf,text/csv,text/plain,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.openxmlformats-officedocument.presentationml.presentation">
<script>
const screen=document.getElementById('screen'),conn=document.getElementById('conn'),camera=document.getElementById('cameraInput'),gallery=document.getElementById('galleryInput'),fileInput=document.getElementById('fileInput');
const params=new URLSearchParams(location.search),urlCode=(params.get('code')||'').trim().toUpperCase();
let code=urlCode||localStorage.getItem('aiSnapCode')||'',busy=false,publicKey=null;
const base=location.origin;
function setConn(ok,text){conn.textContent=text;document.querySelector('.connection').style.opacity=ok?'1':'.7'}
function renderConnect(message='Enter the 6-character code shown in the Orami extension on your PC.'){
  screen.innerHTML=`<section class="hero"><h1>Connect your phone.</h1><p>${message}</p></section><div class="glass pair"><h2>Pairing code</h2><p>Type a new code anytime. This replaces the saved pairing on this phone.</p><input id="pairInput" class="pairInput" maxlength="6" inputmode="text" autocomplete="one-time-code" autocapitalize="characters" placeholder="ABC123"><a class="help-link" href="/#how-to-connect">How do I get a code or pair my phone? ↗</a><button id="connectBtn" class="primary">Connect</button><div id="pairError" class="error"></div></div>`;
  const input=document.getElementById('pairInput'),btn=document.getElementById('connectBtn');input.focus();input.addEventListener('input',()=>input.value=input.value.replace(/[^a-zA-Z0-9]/g,'').toUpperCase().slice(0,6));btn.onclick=()=>connectWithCode(input.value);input.addEventListener('keydown',e=>{if(e.key==='Enter')connectWithCode(input.value)});
}
function disconnectPhone(){code='';publicKey=null;localStorage.removeItem('aiSnapCode');history.replaceState(null,'',location.pathname);setConn(false,'Not paired');renderConnect('Enter a new pairing code from the PC extension.')}
function renderReady(){
  screen.innerHTML=`<section class="hero"><h1>Ready when you are.</h1><p>Send photos or documents to the currently open ChatGPT, Gemini, or Claude tab.</p></section><div class="actions"><button class="action" id="cameraBtn"><span class="action-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h-4L8.5 6H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3.5L14 4Z"/><circle cx="12" cy="13" r="4"/></svg></span><span><strong>Take Photo</strong><span>Open your camera</span></span></button><div class="section-label">Photos</div><button class="action" id="galleryBtn"><span class="action-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></span><span><strong>Choose from Gallery</strong><span>Select up to 4 pictures at once</span></span></button><div class="section-label">Documents &amp; files</div><button class="action" id="fileBtn"><span class="action-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8M8 17h8"/></svg></span><span><strong>Add a File</strong><span>PDF, CSV, TXT, DOCX, XLSX and PPTX</span></span></button></div><div class="bottom"><div class="status"><i class="dot"></i> Connected • ${code}</div><button class="secondary" id="change">Change pairing code</button></div>`;
  document.getElementById('cameraBtn').onclick=()=>camera.click();document.getElementById('galleryBtn').onclick=()=>gallery.click();document.getElementById('fileBtn').onclick=()=>fileInput.click();document.getElementById('change').onclick=disconnectPhone;
}
async function connectWithCode(value){
  const next=value.trim().toUpperCase(),err=document.getElementById('pairError');if(next.length!==6){err.textContent='Enter the 6-character pairing code.';return}err.textContent='Checking code…';
  try{const r=await fetch(`${base}/api/pair/status?code=${encodeURIComponent(next)}`,{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok||!d.e2ee||!d.publicKey)throw new Error();code=next;publicKey=d.publicKey;localStorage.setItem('aiSnapCode',code);history.replaceState(null,'',`${location.pathname}?code=${code}`);setConn(true,'Connected');renderReady()}catch{err.textContent='That code is invalid or expired. Create a new pairing on the PC.'}
}
function renderUploading(url){screen.innerHTML=`<section class="hero"><h1>Sending…</h1><p>Encrypting and sending your file to your connected PC.</p></section><div class="glass preview"><img src="${url}" alt="Uploading photo"></div><div class="bottom"><div class="status">🔐 End-to-end encrypted • sending…</div></div>`}
function renderSuccess(url){screen.innerHTML=`<section class="hero success"><h1>Sent.</h1><p>Your encrypted file was delivered to the Orami extension.</p></section><div class="glass preview"><img src="${url}" alt="Sent photo"></div><div class="bottom"><button class="primary" id="again">Send Another</button><button class="secondary" id="disconnect">Disconnect / use another code</button></div>`;document.getElementById('again').onclick=renderReady;document.getElementById('disconnect').onclick=disconnectPhone}
function b64url(bytes){let bin='';const a=new Uint8Array(bytes);for(let i=0;i<a.length;i++)bin+=String.fromCharCode(a[i]);return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
async function importPublicKey(jwk){return crypto.subtle.importKey('jwk',jwk,{name:'RSA-OAEP',hash:'SHA-256'},false,['encrypt'])}
async function getFreshPublicKey(){
  const r=await fetch(`${base}/api/pair/status?code=${encodeURIComponent(code)}`,{cache:'no-store'});
  const d=await r.json();
  if(!r.ok||!d.ok||!d.e2ee||!d.publicKey)throw new Error('Secure pairing key is unavailable');
  publicKey=d.publicKey;
  return publicKey;
}
async function prepareImage(file){
  const MAX_SIDE=3000;
  if(!file||!file.type.startsWith('image/'))return file;
  try{
    const bitmap=await createImageBitmap(file,{imageOrientation:'from-image'});
    if(bitmap.width<=MAX_SIDE&&bitmap.height<=MAX_SIDE){bitmap.close();return file;}
    const scale=Math.min(1,MAX_SIDE/Math.max(bitmap.width,bitmap.height));
    const w=Math.max(1,Math.round(bitmap.width*scale)),h=Math.max(1,Math.round(bitmap.height*scale));
    const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
    const ctx=canvas.getContext('2d',{alpha:false});ctx.drawImage(bitmap,0,0,w,h);bitmap.close();
    const outputType=file.type==='image/png'?'image/png':file.type==='image/webp'?'image/webp':'image/jpeg';
    const quality=outputType==='image/png'?undefined:.90;
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,outputType,quality));
    if(!blob)return file;
    const ext=outputType==='image/png'?'.png':outputType==='image/webp'?'.webp':'.jpg';
    const name=(file.name||'ai-snap').replace(/\.[^.]+$/,'')+ext;
    return new File([blob],name,{type:outputType,lastModified:Date.now()});
  }catch(_){return file}
}
async function encryptFile(file){
  const jwk=await getFreshPublicKey();
  const aes=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt']);
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const plain=await file.arrayBuffer();
  const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},aes,plain);
  const raw=await crypto.subtle.exportKey('raw',aes);
  const rsa=await importPublicKey(jwk);
  const wrapped=await crypto.subtle.encrypt({name:'RSA-OAEP'},rsa,raw);
  return {cipher,iv:b64url(iv),wrapped:b64url(wrapped),mime:file.type||'application/octet-stream',name:file.name||'ai-snap.bin'};
}
async function uploadOne(file){
  const url=URL.createObjectURL(file);
  try{
    const prepared=await prepareImage(file);const e=await encryptFile(prepared);
    const r=await fetch(`${base}/api/upload?code=${encodeURIComponent(code)}`,{method:'POST',headers:{'Content-Type':e.mime,'X-AI-Snap-IV':e.iv,'X-AI-Snap-AES-Key':e.wrapped,'X-AI-Snap-Name':encodeURIComponent(e.name)},body:e.cipher,cache:'no-store'});
    const d=await r.json();if(!r.ok)throw new Error(d.error||'Upload failed');return {ok:true,url};
  }catch(e){URL.revokeObjectURL(url);return {ok:false,error:e.message||'Upload failed'};}
}
async function upload(files){
  const list=Array.from(files||[]).filter(Boolean);if(busy||!list.length)return;
  if(list.length>4){alert('Please choose up to 4 images at a time.');return;}
  busy=true;const sentUrls=[];let failed=[];
  try{
    for(let i=0;i<list.length;i++){
      screen.innerHTML=`<section class="hero"><h1>${list.length>1?'Sending files…':'Sending…'}</h1><p>Encrypting file ${i+1} of ${list.length}. Keep this page open until sending finishes.</p></section><div class="bottom"><div class="status">🔐 End-to-end encrypted • ${i+1} / ${list.length}</div></div>`;
      const result=await uploadOne(list[i]);
      if(result.ok)sentUrls.push(result.url);else failed.push(`${list[i].name||'File '+(i+1)}: ${result.error}`);
    }
    screen.innerHTML=`<section class="hero success"><h1>${failed.length?'Sending finished':'Sent successfully.'}</h1><p>${sentUrls.length} of ${list.length} file(s) sent to Orami.${failed.length?' Some files could not be sent.':''}</p></section><div class="glass preview"><p style="text-align:center;color:#c7c9d9">${list.map(f=>f.name||'Photo').join('<br>')}</p></div>${failed.length?`<div class="error">${failed.map(x=>x.replace(/&/g,'&amp;').replace(/</g,'&lt;')).join('<br>')}</div>`:''}<div class="bottom"><button class="primary" id="again">Send More</button><button class="secondary" id="disconnect">Disconnect / use another code</button></div>`;
    document.getElementById('again').onclick=renderReady;document.getElementById('disconnect').onclick=disconnectPhone;
  }finally{sentUrls.forEach(URL.revokeObjectURL);busy=false}
}
camera.onchange=()=>{const f=camera.files?.[0];camera.value='';if(f)upload([f])};gallery.onchange=()=>{const files=Array.from(gallery.files||[]);gallery.value='';if(files.length)upload(files)};fileInput.onchange=()=>{const f=fileInput.files?.[0];fileInput.value='';if(f)upload([f])};
(async()=>{if(!code){setConn(false,'Not paired');renderConnect();return}try{const d=await getFreshPublicKey();if(!d)throw new Error();localStorage.setItem('aiSnapCode',code);setConn(true,'Connected');renderReady()}catch{localStorage.removeItem('aiSnapCode');code='';publicKey=null;setConn(false,'Not paired');renderConnect('This pairing is missing or expired. Enter a new code from the PC extension.')}})();
</script></body></html>
