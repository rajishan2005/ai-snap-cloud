<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1024">
<title>AI Snap</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<style>
:root{--bg:#080b18;--text:#f7f7ff;--muted:#b8bbce;--glass:rgba(30,36,66,.82);--line:rgba(255,255,255,.15);--green:#53e88a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}body{min-height:100svh;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;pointer-events:none;filter:blur(55px);opacity:.65;z-index:0;border-radius:50%}body:before{width:260px;height:260px;left:-100px;top:12%;background:#4b3c9f}body:after{width:300px;height:300px;right:-130px;bottom:8%;background:#164eaa}
.app{position:relative;z-index:1;min-height:100svh;max-width:520px;margin:auto;padding:18px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column}.topbar{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 18px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}.logo{width:40px;height:40px;border:1px solid rgba(155,180,255,.7);border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(100,142,255,.3),rgba(147,92,255,.22))}.connection{display:flex;align-items:center;gap:7px;padding:9px 12px;border-radius:999px;background:rgba(28,36,67,.68);border:1px solid rgba(255,255,255,.08);font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.hero{text-align:center;margin:7vh 0 34px}.hero h1{font-size:31px;line-height:1.05;margin:0 0 12px;letter-spacing:-.04em}.hero p{margin:0 auto;max-width:330px;color:var(--muted);font-size:15px;line-height:1.55}.glass{background:var(--glass);border:1px solid var(--line);border-radius:25px;box-shadow:0 22px 70px rgba(0,0,0,.3),inset 0 1px rgba(255,255,255,.07);backdrop-filter:blur(22px)}
.actions{display:flex;flex-direction:column;gap:14px}.action{appearance:none;width:100%;min-height:104px;padding:18px;border:1px solid rgba(255,255,255,.16);border-radius:23px;color:#fff;text-align:left;background:linear-gradient(145deg,rgba(92,99,145,.7),rgba(36,42,76,.83));display:flex;align-items:center;gap:16px;box-shadow:inset 0 1px rgba(255,255,255,.12),0 14px 35px rgba(0,0,0,.18);cursor:pointer}.action:active{transform:scale(.985)}.action-icon{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;background:rgba(255,255,255,.12);font-size:27px;flex:none}.action strong{display:block;font-size:17px;margin-bottom:5px}.action span{display:block;color:#c7c9d9;font-size:13px}.bottom{margin-top:auto;padding-top:26px}.status{display:flex;align-items:center;justify-content:center;gap:8px;color:#aeb2c6;font-size:12px;padding:12px 15px;border-radius:18px;background:rgba(20,27,52,.65);border:1px solid rgba(255,255,255,.08)}.pair{padding:24px}.pair h2{text-align:center;margin:2px 0 8px;font-size:24px}.pair p{text-align:center;color:var(--muted);font-size:14px;line-height:1.5;margin:0 auto 20px;max-width:310px}.code{letter-spacing:7px;text-align:center;font:800 28px ui-monospace,monospace;padding:12px 8px;border-radius:16px;background:rgba(8,12,28,.45);border:1px solid rgba(255,255,255,.16)}.primary{display:block;width:100%;height:54px;margin-top:12px;border:0;border-radius:18px;color:white;font-size:16px;font-weight:750;background:linear-gradient(100deg,#8b5cf6,#4f8cff)}.error{text-align:center;color:#ffaaa9;font-size:12px;min-height:18px;margin-top:10px}.preview{margin-top:18px;padding:10px;border-radius:23px;background:rgba(12,17,37,.7);border:1px solid rgba(255,255,255,.1)}.preview img{display:block;width:100%;max-height:45vh;object-fit:cover;border-radius:17px}.success{text-align:center}.success h2{font-size:27px;margin:6px 0 8px}.success p{margin:0;color:var(--muted);font-size:14px}
input[type=file]{display:none}
@media(max-height:700px){.hero{margin:22px 0 20px}.hero h1{font-size:27px}.action{min-height:88px}.action-icon{width:48px;height:48px;font-size:24px}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar"><div class="brand"><div class="logo">⌁</div>AI Snap</div><div class="connection"><i class="dot"></i><span id="conn">Checking…</span></div></div>
  <div id="screen"></div>
</div>
<input id="cameraInput" type="file" accept="image/*" capture="environment">
<input id="galleryInput" type="file" accept="image/*">
<script>
const screen=document.getElementById('screen');const conn=document.getElementById('conn');const camera=document.getElementById('cameraInput');const gallery=document.getElementById('galleryInput');
const code=new URLSearchParams(location.search).get('code');const base=location.origin;
let busy=false;
function setConn(ok,text){conn.textContent=text;document.querySelector('.connection').style.opacity=ok?'1':'.7'}
function renderReady(){screen.innerHTML=`<section class="hero"><h1>Ready when you are.</h1><p>Capture an image on this phone and AI Snap will send it to your connected PC.</p></section><div class="actions"><button class="action" id="cameraBtn"><span class="action-icon">📷</span><span><strong>Take Photo</strong><span>Open your camera</span></span></button><button class="action" id="galleryBtn"><span class="action-icon">🖼️</span><span><strong>Choose from Gallery</strong><span>Pick an existing image</span></span></button></div><div class="bottom"><div class="status"><i class="dot"></i> Connected • pairing ${code}</div></div>`;document.getElementById('cameraBtn').onclick=()=>camera.click();document.getElementById('galleryBtn').onclick=()=>gallery.click();}
function renderConnect(){screen.innerHTML=`<section class="hero"><h1>Connect your phone.</h1><p>Use the pairing link from the AI Snap extension on your PC.</p></section><div class="glass pair"><h2>Pairing required</h2><p>This phone link is missing a valid pairing code. Create a new pairing from the PC extension.</p></div>`}
function renderUploading(url){screen.innerHTML=`<section class="hero"><h1>Sending…</h1><p>Your image is travelling to the connected PC.</p></section><div class="glass preview"><img src="${url}" alt="Uploading photo"></div><div class="bottom"><div class="status">Sending securely…</div></div>`}
function renderSuccess(url){screen.innerHTML=`<section class="hero success"><h1>Sent.</h1><p>Your image has been delivered to the AI Snap extension.</p></section><div class="glass preview"><img src="${url}" alt="Sent photo"></div><div class="bottom"><button class="primary" id="again">Send Another</button></div>`;document.getElementById('again').onclick=renderReady}
async function upload(file){if(busy||!file)return;busy=true;const url=URL.createObjectURL(file);renderUploading(url);try{const r=await fetch(`${base}/api/upload?code=${encodeURIComponent(code)}`,{method:'POST',headers:{'Content-Type':file.type||'image/jpeg'},body:file,cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Upload failed');renderSuccess(url)}catch(e){screen.innerHTML=`<section class="hero"><h1>Couldn't send it.</h1><p>Please check your connection and try again.</p></section><div class="error">${e.message||'Upload failed'}</div><div class="bottom"><button class="primary" id="retry">Try Again</button></div>`;document.getElementById('retry').onclick=renderReady}finally{busy=false}}
camera.onchange=()=>{const f=camera.files?.[0];camera.value='';if(f)upload(f)};gallery.onchange=()=>{const f=gallery.files?.[0];gallery.value='';if(f)upload(f)};
(async()=>{if(!code){setConn(false,'Not paired');renderConnect();return}try{const r=await fetch(`${base}/api/pair/status?code=${encodeURIComponent(code)}`,{cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok)throw new Error();setConn(true,'Connected');renderReady()}catch{setConn(false,'Pair expired');renderConnect()}})();
</script>
</body></html>
